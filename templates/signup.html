<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AI Placement Portal</title>
    <link rel="stylesheet" href="/static/css/signup.css">
</head>

<body>

<header>
    
    <div class="logo">
        <img src="/static/images/EngiPrep_Logo.png" alt="logo image">
        <h2>EngiPrep – Placement Preparation Platform</h2>
    </div>

    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="{{ url_for('login_page') }}">Login</a></li>
            <li><a href="/signup">Sign Up</a></li>
        </ul>
    </nav>

</header>

<div class="signup-container">

    <h2>Create Account</h2>

    <p class="welcome-text">
        Join Smart Placement Portal and start your placement preparation.
    </p>

    <form id="signupForm">

        <div class="input-group">
            <input type="text" id="fullname" required>
            <label>Full Name</label>
        </div>

        <div class="input-group">
            <input type="email" id="email" required>
            <label>Email Address</label>
        </div>

        <div class="input-group">
            <input type="text" id="username" required>
            <label>Username</label>
        </div>

        <div class="input-group">
            <input type="password" id="password" required>
            <label>Password</label>
        </div>

        <div class="input-group">
            <input type="password" id="confirmPassword" required>
            <label>Confirm Password</label>
        </div>

        <button type="submit">Create Account</button>

    </form>

    <p class="login-text">
        Already have an account?
        <a href="{{ url_for('login_page') }}">Login</a>
    </p>

</div>

<script
    src="/static/js/signup.js">


</script>

</body>

</html>
